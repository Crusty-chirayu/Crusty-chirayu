name: Generate Metrics Dashboard

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Crusty-chirayu
          template: classic

          # Keep the base section short — just the header/stat counters
          base: header, activity

          # Language breakdown, compact bar-style
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_details: percentage

          # This IS the axis / line graph — additions vs deletions over time
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 20

          # Contribution calendar as a 3D-style graph
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
